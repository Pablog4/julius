spring.application.name=julius

# ===== Banco de dados (RNF03) =====
# Troque usuário e senha pelos do SEU MySQL.
# createDatabaseIfNotExist=true cria o banco "julius" sozinho.
spring.datasource.url=jdbc:mysql://localhost:3306/julius?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=

# Cria/atualiza a tabela "gasto" automaticamente a partir da classe Gasto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Padrão brasileiro (RNF05): R$ 1.234,56 e dd/MM/yyyy =====
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
