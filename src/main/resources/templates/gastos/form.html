<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${gasto.id == null} ? 'JULIUS - Cadastro de gasto' : 'JULIUS - Edição de gasto'">JULIUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/julius.css}" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 640px;">

    <header class="mb-4">
        <a class="marca" th:href="@{/gastos}">JULIUS</a>
    </header>

    <!-- A mesma tela serve para Cadastro (RF01) e Edição (RF03):
         se o gasto ainda não tem id, é cadastro; se tem, é edição. -->
    <h1 class="h3 mb-3" th:text="${gasto.id == null} ? 'Cadastro de gasto' : 'Edição de gasto'">Cadastro de gasto</h1>

    <form th:object="${gasto}"
          th:action="${gasto.id == null} ? @{/gastos} : @{/gastos/{id}(id=${gasto.id})}"
          method="post" class="painel p-4" novalidate>

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição *</label>
            <input type="text" th:field="*{descricao}" class="form-control" maxlength="100"
                   th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{descricao}"></div>
        </div>

        <div class="row">
            <div class="col-sm-6 mb-3">
                <label for="categoria" class="form-label">Categoria *</label>
                <select th:field="*{categoria}" class="form-select"
                        th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                    <option value="">Selecione</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.label}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{categoria}"></div>
            </div>

            <div class="col-sm-6 mb-3">
                <label for="valor" class="form-label">Valor (R$) *</label>
                <input type="number" step="0.01" min="0.01" th:field="*{valor}" class="form-control"
                       th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{valor}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6 mb-3">
                <label for="data" class="form-label">Data *</label>
                <input type="date" th:field="*{data}" class="form-control"
                       th:classappend="${#fields.hasErrors('data')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{data}"></div>
            </div>

            <div class="col-sm-6 mb-3">
                <label for="formaPagamento" class="form-label">Forma de pagamento</label>
                <select th:field="*{formaPagamento}" class="form-select">
                    <option value="">Não informar</option>
                    <option th:each="f : ${formasPagamento}" th:value="${f}" th:text="${f.label}"></option>
                </select>
            </div>
        </div>

        <p class="small text-secondary">* Campos obrigatórios</p>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-julius"
                    th:text="${gasto.id == null} ? 'Salvar' : 'Atualizar'">Salvar</button>
            <a th:href="@{/gastos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

</main>
</body>
</html>
