<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JULIUS - Meus gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/julius.css}" rel="stylesheet">
</head>
<body>
<main class="container py-4" style="max-width: 960px;">

    <header class="d-flex justify-content-between align-items-center mb-4">
        <a class="marca" th:href="@{/gastos}">JULIUS</a>
        <a class="btn btn-julius" th:href="@{/gastos/novo}">Novo gasto</a>
    </header>

    <!-- Mensagens depois de salvar/excluir -->
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <!-- RF06: total dos gastos exibidos -->
    <section class="total mb-4">
        <div th:text="${categoriaSelecionada != null or !#strings.isEmpty(busca)} ? 'Total dos gastos filtrados' : 'Total gasto'">Total gasto</div>
        <div class="total-valor" th:text="${#numbers.formatCurrency(total)}">R$ 0,00</div>
    </section>

    <!-- RF05 Pesquisar + RF06 Filtrar -->
    <form th:action="@{/gastos}" method="get" class="painel p-3 mb-3 row g-2 align-items-end mx-0">
        <div class="col-md-6">
            <label for="busca" class="form-label">Pesquisar pela descrição</label>
            <input type="search" id="busca" name="busca" class="form-control"
                   placeholder="Ex.: supermercado" th:value="${busca}">
        </div>
        <div class="col-md-4">
            <label for="categoria" class="form-label">Categoria</label>
            <select id="categoria" name="categoria" class="form-select">
                <option value="">Todas</option>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.label}"
                        th:selected="${c == categoriaSelecionada}"></option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-dark">Filtrar</button>
        </div>
        <div class="col-12" th:if="${categoriaSelecionada != null or !#strings.isEmpty(busca)}">
            <a th:href="@{/gastos}" class="small">Limpar filtros</a>
        </div>
    </form>

    <!-- RF02: lista de gastos -->
    <section class="painel">
        <div th:if="${#lists.isEmpty(gastos)}" class="p-4 text-center">
            <p class="mb-2">Nenhum gasto encontrado.</p>
            <a th:href="@{/gastos/novo}">Cadastre o primeiro gasto</a>
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(gastos)}">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th class="text-end">Valor</th>
                    <th>Data</th>
                    <th>Pagamento</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${gastos}">
                    <td th:text="${g.descricao}">Supermercado</td>
                    <td><span class="badge badge-categoria" th:text="${g.categoria.label}">Alimentação</span></td>
                    <td class="text-end valor" th:text="${#numbers.formatCurrency(g.valor)}">R$ 185,90</td>
                    <td th:text="${#temporals.format(g.data, 'dd/MM/yyyy')}">09/09/2026</td>
                    <td th:text="${g.formaPagamento != null} ? ${g.formaPagamento.label} : '—'">Pix</td>
                    <td class="text-end text-nowrap">
                        <!-- RF03 Editar -->
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/gastos/{id}/editar(id=${g.id})}">Editar</a>
                        <!-- RF04 Excluir com confirmação (RN004) -->
                        <form th:action="@{/gastos/{id}/excluir(id=${g.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Excluir este gasto? Essa ação não pode ser desfeita.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
